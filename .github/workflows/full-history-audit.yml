name: Full genome history audit (manual)

# Run manually about four times a year (e.g. January, April, July, October).
# Read-only: generates a report/artifact, never commits or deploys data.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/full-history-audit.yml'

permissions:
  contents: read

concurrency:
  group: genome-observatory-full-history-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install NCBI Datasets
        run: |
          curl -fsSL https://ftp.ncbi.nlm.nih.gov/pub/datasets/command-line/v2/linux-amd64/datasets -o /usr/local/bin/datasets
          chmod +x /usr/local/bin/datasets
          datasets version
      - name: Full NCBI versus dashboard reconciliation
        run: python scripts/audit_full_history.py --output-dir audit-results
      - name: Identify 11000th distinct species from full inventory
        run: |
          python - <<'PY'
          import csv
          import json
          from pathlib import Path
          rows = list(csv.DictReader(Path("audit-results/ncbi_full_inventory.csv").open(newline="", encoding="utf-8")))
          rows = [r for r in rows if all(r.get(k) for k in ("release_date", "accession", "organism_name"))]
          rows.sort(key=lambda r: (r["release_date"], r["accession"]))
          first = {}
          for row in rows:
              first.setdefault(row["organism_name"], row)
          species = sorted(first.values(), key=lambda r: (r["release_date"], r["accession"]))
          result = {
              "method": "First qualifying GenBank eukaryote chromosome/complete assembly per organism_name, ordered by release_date and accession",
              "species_count": len(species),
              "milestone_rank": 11000,
              "milestone": species[10999] if len(species) >= 11000 else None,
              "neighbors": [{"rank": i + 1, **species[i]} for i in range(max(0, 10996), min(len(species), 11003))]
          }
          Path("audit-results/species_milestone_11000.json").write_text(json.dumps(result, indent=2) + "\n")
          with Path("audit-results/species_first_assembly_order.csv").open("w", newline="") as fh:
              writer = csv.DictWriter(fh, fieldnames=["rank", "organism_name", "accession", "release_date", "tax_id"])
              writer.writeheader()
              writer.writerows({"rank": i, **r} for i, r in enumerate(species, 1))
          print(json.dumps(result, indent=2))
          PY
      - name: Identify published 11000th species using dashboard first-seen records
        run: |
          python - <<'PY'
          import csv
          import json
          from collections import defaultdict
          from pathlib import Path

          dashboard = json.loads(Path("data/dashboard.json").read_text(encoding="utf-8"))
          first_seen = dashboard.get("species_first_seen") or {}
          published_count = int(dashboard["summary"]["all"]["species"])
          if len(first_seen) != published_count:
              raise RuntimeError(f"First-seen records ({len(first_seen)}) differ from published species total ({published_count})")
          if published_count < 11000:
              raise RuntimeError("Published count has not reached 11000")
          date_rank = sorted(first_seen.values())
          target_day = date_rank[10999]
          before = sum(day < target_day for day in first_seen.values())
          tied_names = {name for name, day in first_seen.items() if day == target_day}
          by_name = defaultdict(list)
          for r in dashboard.get("recent_assemblies", []):
              if r.get("organism_name") in tied_names and str(r.get("release_date", ""))[:10] == target_day and r.get("accession"):
                  by_name[r["organism_name"]].append({"organism_name":r["organism_name"],"release_date":target_day,"accession":r["accession"],"tax_id":str(r.get("tax_id") or "")})
          with Path("audit-results/ncbi_full_inventory.csv").open(newline="", encoding="utf-8") as fh:
              for r in csv.DictReader(fh):
                  if r.get("organism_name") in tied_names and r.get("release_date") == target_day and r.get("accession"):
                      by_name[r["organism_name"]].append(r)
          unresolved = sorted(tied_names - by_name.keys())
          if unresolved:
              raise RuntimeError(f"Cannot verify first-assembly accessions on milestone date: {unresolved}")
          first_rows = [min(by_name[name], key=lambda r:r["accession"]) for name in tied_names]
          first_rows.sort(key=lambda r:r["accession"])
          within_day_rank = 11000 - before
          result = {
              "source":"Published data/dashboard.json species_first_seen, with dashboard recent assemblies and NCBI accession verification",
              "generated_at":dashboard.get("generated_at"),
              "published_species":published_count,
              "milestone_rank":11000,
              "milestone_day":target_day,
              "species_before_day":before,
              "species_first_seen_on_day":len(first_rows),
              "within_day_rank":within_day_rank,
              "milestone":first_rows[within_day_rank - 1],
              "milestone_day_order": [{"overall_rank":before+i, **r} for i,r in enumerate(first_rows,1)]
          }
          Path("audit-results/published_species_milestone_11000.json").write_text(json.dumps(result,indent=2)+"\n",encoding="utf-8")
          print("PUBLISHED_SPECIES_MILESTONE_BEGIN")
          print(json.dumps(result,indent=2))
          print("PUBLISHED_SPECIES_MILESTONE_END")
          PY
      - name: Add audit report to job summary
        if: always()
        run: |
          if [ -f audit-results/audit_report.md ]; then
            cat audit-results/audit_report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Audit did not produce a report. Inspect the failed job log.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-history-audit-${{ github.run_id }}
          path: audit-results/
          if-no-files-found: warn
          retention-days: 90
