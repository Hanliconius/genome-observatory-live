name: Genometrics audit

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/audit_sex_eutils.py'
      - '.github/workflows/genometrics-audit.yml'

permissions:
  contents: read

concurrency:
  group: genometrics-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install NCBI Datasets
        run: |
          curl -fsSL https://ftp.ncbi.nlm.nih.gov/pub/datasets/command-line/v2/linux-amd64/datasets -o /usr/local/bin/datasets
          chmod +x /usr/local/bin/datasets
          datasets version
      - name: Test chromosome-filtered accession package
        run: python scripts/audit_datasets_chrom_filter.py
