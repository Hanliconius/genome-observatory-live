name: Refresh genome dashboard

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'index.html'
      - 'scripts/**'
      - '.github/workflows/update.yml'

permissions:
  contents: write
  pages: write
  id-token: write

# Keep scheduled/manual data refreshes serialized, but do not let ordinary
# UI pushes cancel one another while GitHub is still waiting to assign a runner.
# Each push gets its own lane; Pages itself will publish the newest completed run.
concurrency:
  group: ${{ github.event_name == 'push' && format('genome-observatory-live-push-{0}', github.run_id) || 'genome-observatory-live-refresh' }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install NCBI Datasets
        run: |
          curl -fsSL https://ftp.ncbi.nlm.nih.gov/pub/datasets/command-line/v2/linux-amd64/datasets -o /usr/local/bin/datasets
          chmod +x /usr/local/bin/datasets
          datasets version

      - name: Install Python dependencies
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[refresh]') || contains(github.event.head_commit.message, '[genometrics-refresh]')
        run: pip install -r requirements.txt

      - name: Bootstrap lifetime history on first run
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[refresh]')
        shell: bash
        run: |
          if grep -q '"demo_seed": true' data/dashboard.json; then
            python scripts/bootstrap_history.py
          fi

      - name: Refresh recent assemblies, annotations and images
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[refresh]')
        run: python scripts/update.py
        env:
          RECENT_DAYS: '370'
          OVERLAP_DAYS: '14'

      - name: Build phylum and order explorer
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[refresh]')
        run: python scripts/build_taxa.py

      - name: Build country explorer
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[refresh]')
        run: python scripts/build_countries.py

      - name: Build sequencing-center country explorer
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[refresh]')
        run: python scripts/build_sequencing_countries.py

      - name: Build genometrics
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[genometrics-refresh]')
        run: python scripts/build_genometrics.py

      - name: Build IUCN threatened and extinct views
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[refresh]')
        run: python scripts/build_iucn.py

      - name: Commit changed data
        run: |
          git config user.name 'genome-observatory-live-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/dashboard.json data/taxa data/status data/countries.json data/sequencing_countries.json data/genometrics.json cache
          if [ -d data/audits ]; then git add data/audits; fi
          if git diff --cached --quiet; then
            echo 'No data changes to commit.'
          else
            git commit -m 'data: refresh NCBI genome activity'
            git fetch origin main
            if [ "$(git rev-parse HEAD^)" != "$(git rev-parse origin/main)" ]; then
              echo 'main advanced during this run; regenerate from latest main to avoid generated-data merge conflicts.'
              git reset --hard origin/main
              python scripts/build_genometrics.py
              git add data/genometrics.json cache
              if git diff --cached --quiet; then
                echo 'No genometrics changes remain after regeneration.'
              else
                git commit -m 'data: refresh NCBI genome activity'
              fi
            fi
            git push origin HEAD:main
          fi

      - name: Prepare Pages artifact
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp -R app _site/app
          cp -R data _site/data

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: refresh
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
