name: Refresh genome dashboard

on:
  schedule:
    - cron: '17 10 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'index.html'
      - 'scripts/**'
      - '.github/workflows/update.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: genome-watch-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[refresh]')
        with:
          python-version: '3.12'

      - name: Install NCBI Datasets
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[refresh]')
        run: |
          curl -fsSL https://ftp.ncbi.nlm.nih.gov/pub/datasets/command-line/v2/linux-amd64/datasets -o /usr/local/bin/datasets
          chmod +x /usr/local/bin/datasets
          datasets version

      - name: Install Python dependencies
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[refresh]')
        run: pip install -r requirements.txt

      - name: Bootstrap lifetime history on first run
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[refresh]')
        shell: bash
        run: |
          if grep -q '"demo_seed": true' data/dashboard.json; then
            python scripts/bootstrap_history.py
          fi

      - name: Refresh recent assemblies, annotations and images
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[refresh]')
        run: python scripts/update.py
        env:
          RECENT_DAYS: '370'
          OVERLAP_DAYS: '14'

      - name: Build phylum and order explorer
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[refresh]')
        run: python scripts/build_taxa.py

      - name: Build IUCN threatened and extinct views
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[refresh]')
        run: python scripts/build_iucn.py

      - name: Commit changed data
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[refresh]')
        run: |
          git config user.name 'genome-watch-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/dashboard.json data/taxa data/status
          git diff --cached --quiet || git commit -m 'data: refresh NCBI genome activity'
          git push

      - name: Prepare Pages artifact
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp -R app _site/app
          cp -R data _site/data

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: refresh
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
