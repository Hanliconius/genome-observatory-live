name: Refresh genome dashboard

on:
  schedule:
    - cron: '17 10 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'index.html'
      - 'scripts/**'
      - '.github/workflows/update.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: genome-watch-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install NCBI Datasets
        run: |
          curl -fsSL https://ftp.ncbi.nlm.nih.gov/pub/datasets/command-line/v2/linux-amd64/datasets -o /usr/local/bin/datasets
          chmod +x /usr/local/bin/datasets
          datasets version

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Bootstrap lifetime history on first run
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[refresh]')
        shell: bash
        run: |
          if grep -q '"demo_seed": true' data/dashboard.json; then
            python scripts/bootstrap_history.py
          fi

      - name: Refresh recent assemblies, annotations and images
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[refresh]')
        run: python scripts/update.py
        env:
          RECENT_DAYS: '370'
          OVERLAP_DAYS: '14'

      - name: Build phylum and order explorer
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[refresh]')
        run: python scripts/build_taxa.py

      - name: Build country explorer
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[refresh]')
        run: python scripts/build_countries.py

      - name: Build sequencing-center country explorer
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[refresh]')
        run: python scripts/build_sequencing_countries.py

      - name: Build genometrics
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[genometrics-refresh]')
        run: python scripts/build_genometrics.py

      - name: Diagnose NCBI multi-accession sequence reports
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[diag-multi]')
        run: |
          python - <<'PY'
          import json, urllib.request
          url="https://api.ncbi.nlm.nih.gov/datasets/v2/genome/sequence_reports"
          a="GCA_000001405.29"
          b="GCA_000002315.5"
          tests=[
              ("comma", a+","+b),
              ("space", a+" "+b),
              ("newline", a+"\n"+b),
              ("semicolon", a+";"+b),
              ("single-human", a),
              ("single-chicken", b),
          ]
          for name,value in tests:
              body={"accession":value,"chromosomes":["X","Y","Z","W"],"page_size":100}
              req=urllib.request.Request(
                  url,
                  data=json.dumps(body).encode(),
                  headers={"Content-Type":"application/json","Accept":"application/json"},
              )
              try:
                  with urllib.request.urlopen(req,timeout=60) as resp:
                      d=json.loads(resp.read().decode())
                  pairs=sorted({(x.get("assembly_accession"),x.get("chr_name"),x.get("role")) for x in d.get("reports",[])})
                  print(name, "N", len(d.get("reports",[])), "ASSEMBLIES", sorted({x[0] for x in pairs if x[0]}), "PRIMARY", [x for x in pairs if x[2]=="assembled-molecule"])
              except Exception as e:
                  print(name,"ERROR",repr(e))
          PY

      - name: Build IUCN threatened and extinct views
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[refresh]')
        run: python scripts/build_iucn.py

      - name: Commit changed data
        run: |
          git config user.name 'genome-watch-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/dashboard.json data/taxa data/status data/countries.json data/sequencing_countries.json data/genometrics.json cache
          git diff --cached --quiet || git commit -m 'data: refresh NCBI genome activity'
          git push

      - name: Prepare Pages artifact
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp -R app _site/app
          cp -R data _site/data

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: refresh
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
